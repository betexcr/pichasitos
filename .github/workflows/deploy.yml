name: Deploy

# Manual production deploy. Requires repo secret FIREBASE_TOKEN
# (firebase login:ci). Deploys Hosting and Database to their respective projects.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:hosting-ignore
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13
      - name: Deploy Hosting (pichasitos)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting --project pichasitos --non-interactive
      - name: Deploy Database rules (pichasitos-arcade)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only database --project pichasitos-arcade --non-interactive
