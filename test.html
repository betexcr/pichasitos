<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>PICHASITOS — Test Mode</title>
  <meta name="theme-color" content="#0A0A2A" />

  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    #test-mode-badge {
      position: fixed;
      top: max(8px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(10, 10, 26, 0.92);
      border: 1px solid #39ff14;
      color: #39ff14;
      font: 700 0.62rem/1.35 system-ui, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 6px;
      pointer-events: none;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
      text-align: center;
      max-width: calc(100vw - 24px);
    }
  </style>
  <script src="js/cache-version.js"></script>
</head>
<body>
  <div id="test-mode-badge">Test mode · Invincible · 1-hit KO</div>

  <div id="screen-wrap">
    <canvas id="glow"></canvas>
    <canvas id="game"></canvas>
  </div>

  <div id="touch-controls">
    <div id="touch-meta">
      <button type="button" class="touch-btn touch-meta-btn" data-action="coin" aria-label="Insertar teja">TEJA</button>
      <button type="button" class="touch-btn touch-meta-btn" data-action="start" aria-label="Start">START</button>
    </div>
    <div id="touch-gameplay">
      <div id="touch-dpad" role="group" aria-label="Movimiento">
        <button type="button" class="touch-btn dpad-btn dpad-up" data-action="up" aria-label="Bloquear"></button>
        <button type="button" class="touch-btn dpad-btn dpad-left" data-action="left" aria-label="Esquivar izquierda"></button>
        <div class="dpad-center" aria-hidden="true"></div>
        <button type="button" class="touch-btn dpad-btn dpad-right" data-action="right" aria-label="Esquivar derecha"></button>
        <button type="button" class="touch-btn dpad-btn dpad-down" data-action="down" aria-label="Agachar"></button>
      </div>
      <div id="touch-actions" role="group" aria-label="Golpes">
        <button type="button" class="touch-btn action-btn action-a" data-action="punchLeft" aria-label="Gancho izquierdo">A</button>
        <button type="button" class="touch-btn action-btn action-s" data-action="punchRight" aria-label="Gancho derecho">S</button>
        <button type="button" class="touch-btn action-btn action-d" data-action="special" aria-label="Zarpe especial">D</button>
      </div>
    </div>
  </div>

  <script src="js/test-mode.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/logger.js"></script>
  <script src="js/fetch-retry.js"></script>
  <script src="js/score-sanitize.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/runtime.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/asset-loader.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/arcade.js"></script>
  <script src="js/player.js"></script>
  <script src="js/opponents.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/online-scoreboard.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
